services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: kabadiwala_connect
      POSTGRES_USER: kabadiwala
      POSTGRES_PASSWORD: kabadiwala_demo_password
    ports:
      - "5432:5432"
    volumes:
      - kabadiwala-postgres:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kabadiwala -d kabadiwala_connect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kabadiwala-postgres:
