<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kabadiwala Connect | Collector Console</title>
  <link rel="stylesheet" href="/dashboard/styles.css">
  <style>
    .collector-wrap{max-width:1050px;margin:0 auto;padding:34px 5vw}.back{color:var(--green);text-decoration:none;font:11px 'DM Mono',monospace}.collector-head{margin:52px 0 34px}.collector-head h1{font-size:clamp(36px,5vw,62px);line-height:1;letter-spacing:-.05em;margin:12px 0}.collector-head h1 em{color:#a4d65e;font-style:normal}.collector-head .notice{color:#9fb7ae}.dark-card{background:#102a24;color:#eff9ee;border:1px solid #234b40;border-radius:4px;padding:24px}.dark-card h2{font-size:18px;margin:8px 0 22px}.dark-card .eyebrow{color:#91b2a7}.console-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.light-card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:24px}.light-card h2{font-size:18px;margin:8px 0 22px}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font:10px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.field input{border:1px solid var(--line);padding:12px;border-radius:4px;font:13px Manrope,sans-serif;color:var(--ink);background:#fbfcfa}.dark-card .field label{color:#91b2a7}.dark-card .field input{border-color:#386054;background:#193a31;color:#eff9ee}.button{border:0;border-radius:4px;background:var(--green);color:white;padding:13px 17px;font:700 12px Manrope,sans-serif;cursor:pointer;width:100%}.dark-card .button{background:#c9ee9d;color:#102a24}.button:disabled{opacity:.55;cursor:not-allowed}.result{margin-top:15px;padding:14px;border-radius:4px;background:#eff8ee;border:1px solid #cae8ca;font-size:12px;display:none}.result.show{display:block}.result.error{background:#fff0ec;border-color:#f0c5bb;color:#a34b40}.result strong,.result small{display:block}.result small{color:var(--muted);margin-top:5px}.dark-card .result{background:#193a31;border-color:#386054}.dark-card .result small{color:#a9c4b9}.trip{display:flex;justify-content:space-between;border-bottom:1px solid #2b5146;padding:11px 0;font:11px 'DM Mono',monospace}.trip:last-child{border:0}.trip strong{color:#c9ee9d}.otp{font:500 26px 'DM Mono',monospace;color:var(--green);letter-spacing:.14em}@media(max-width:720px){.collector-wrap{padding:24px 20px}.collector-head{margin:38px 0 26px}.console-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="collector-wrap">
    <a class="back" href="/dashboard/">← MUNICIPAL VIEW</a>
    <header class="collector-head"><p class="eyebrow" style="color:#17795a">Collector console / field mode</p><h1>Carry less air.<br><em>Recover more value.</em></h1><p class="notice">Plan a capacity-aware run, then close every handoff with the citizen's OTP.</p></header>
    <section class="dark-card" style="margin-bottom:14px"><p class="eyebrow">Route optimizer</p><h2>Build today's run</h2><div class="console-grid"><div><div class="field"><label for="collector-id">Collector ID</label><input id="collector-id" placeholder="UUID from registration"></div><div class="field"><label for="payload">Payload limit (kg)</label><input id="payload" value="100"></div><div class="field"><label for="volume">Volume limit (m³)</label><input id="volume" value="1.00"></div></div><div><div class="field"><label for="stops">Stops · stop_id, weight kg, volume m³</label><input id="stops" value="pickup-a,60,0.20; pickup-b,60,0.20; pickup-c,20,0.20"></div><button class="button" id="optimize">Optimize route</button><div class="result" id="route-result"></div></div></div></section>
    <section class="light-card"><p class="eyebrow">Settlement handshake</p><h2>Assign and close a pickup</h2><div class="console-grid"><div><div class="field"><label for="pickup-id">Pickup ID</label><input id="pickup-id" placeholder="UUID from citizen request"></div><div class="field"><label for="settle-collector-id">Collector ID</label><input id="settle-collector-id" placeholder="UUID from registration"></div><button class="button" id="assign">Assign pickup to me</button><div class="result" id="assign-result"></div><div class="field"><label for="otp">Citizen OTP</label><input id="otp" inputmode="numeric" maxlength="4" placeholder="4826"></div></div><div><div class="field"><label for="material">Material code</label><input id="material" value="pet_plastic"></div><div class="field"><label for="weight">Actual weight (kg)</label><input id="weight" value="5.00"></div><div class="field"><label for="deduction">Quality deduction (%)</label><input id="deduction" value="0.00"></div><button class="button" id="settle">Verify OTP & settle</button><div class="result" id="settle-result"></div></div></div></section>
  </main>
  <script src="/dashboard/collector.js"></script>
</body>
</html>
